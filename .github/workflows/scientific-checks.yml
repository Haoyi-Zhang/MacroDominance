name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded finite tests, replay, and deterministic reproduction
        shell: bash
        run: |
          set -euo pipefail
          export RAW="$RUNNER_TEMP/p080-scientific-output"
          mkdir -p "$RAW"
          timeout --signal=TERM --kill-after=10s 900s bash <<'BOUNDED'
          set -euo pipefail
          ulimit -v 3584000
          ulimit -t 840
          ulimit -f 262144
          python -B -m pip install --disable-pip-version-check --no-compile \
            --only-binary=:all: numpy==2.3.5 scipy==1.16.3 \
            > "$RAW/dependencies.log" 2>&1
          python -B .github/scripts/run_scientific_checks.py --out "$RAW" \
            > "$RAW/runner.log" 2>&1
          BOUNDED
      - name: Upload raw outputs even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p080-scientific-output
          path: ${{ runner.temp }}/p080-scientific-output
          if-no-files-found: error
          retention-days: 14
